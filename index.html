<html lang="ko">
<head>
<meta charset="utf-8">

<title>열맞춤</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one-screen notebook — stats strip on top, graph-paper board scrolls in the middle, pen-tray of actions pinned at the bottom. */
:root {
  --paper: #eef3f7;
  --sheet: #fbfdfe;
  --grid: #d3dee8;
  --ink: #1b2a3a;
  --muted: #8494a6;
  --faint: #c3cfdb;
  --mark: #ffe14d;
  --mark-ink: #1b2a3a;
  --hint: #9fe0c0;
  --accent: #2547c4;
  --accent-ink: #ffffff;
  --bad: #d9434b;
  --shadow: 0 1px 0 rgba(27,42,58,.06), 0 8px 24px rgba(27,42,58,.08);
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f151c; --sheet: #151d26; --grid: #243241; --ink: #e4ecf4; --muted: #6f8295;
    --faint: #3a4a5b; --mark: #f2cf2e; --mark-ink: #11161c; --hint: #2f8f68;
    --accent: #7f9bff; --accent-ink: #0f151c; --bad: #ff6b72;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f151c; --sheet: #151d26; --grid: #243241; --ink: #e4ecf4; --muted: #6f8295;
  --faint: #3a4a5b; --mark: #f2cf2e; --mark-ink: #11161c; --hint: #2f8f68;
  --accent: #7f9bff; --accent-ink: #0f151c; --bad: #ff6b72;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui);
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
.app {
  height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 8px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.brand h1 b { color: var(--accent); font-family: var(--f-num); font-weight: 700; }
.lvl { font-size: 12px; color: var(--muted); letter-spacing: .06em; font-weight: 600; }
.icon-btn {
  border: 0; background: transparent; color: var(--ink); width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn:hover { background: var(--grid); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-bottom: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat span { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
.stat strong { font-family: var(--f-num); font-size: 20px; font-variant-numeric: tabular-nums; }
.stat:nth-child(2) { text-align: center; } .stat:nth-child(3) { text-align: right; }

.board-wrap {
  flex: 1; min-height: 0; overflow-y: auto; background: var(--sheet); border-radius: 14px; box-shadow: var(--shadow);
  scroll-behavior: smooth; position: relative;
}
.board {
  display: grid; grid-template-columns: repeat(9, 1fr);
  border-left: 1px solid var(--grid); border-top: 1px solid var(--grid);
  margin: 10px; background: var(--sheet);
}
.cell {
  aspect-ratio: 1; display: grid; place-items: center; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid);
  font-family: var(--f-num); font-weight: 700; font-size: min(7vw, 30px); line-height: 1; color: var(--ink);
  user-select: none; cursor: pointer; position: relative; transition: color .2s, background-color .15s;
  background: none; padding: 0; border-top: 0; border-left: 0; border-radius: 0; min-width: 0;
}
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.cell.gone { color: var(--faint); cursor: default; font-size: min(5vw, 20px); }
.cell.pad { cursor: default; }
.cell.sel::before, .cell.hint::before {
  content: ""; position: absolute; inset: 14% 8%; border-radius: 4px 9px 5px 8px; z-index: -0;
  background: var(--mark); transform: rotate(-3deg); opacity: .95;
}
.cell.hint::before { background: var(--hint); animation: pulse 1s ease-in-out infinite; }
.cell.sel, .cell.hint { color: var(--mark-ink); }
.cell > i { position: relative; font-style: normal; }
.cell.pop { animation: pop .32s ease-out; }
.cell.bad { animation: shake .3s; color: var(--bad); }
.cell.vanish { animation: vanish .28s ease-in forwards; }
@keyframes pop { 0% { transform: scale(1.25); color: var(--accent); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }
@keyframes vanish { to { opacity: 0; transform: scaleY(.2); } }
@keyframes pulse { 50% { opacity: .55; } }

.tray { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-block: 12px max(14px, env(safe-area-inset-bottom, 0px)); }
.act {
  border: 1px solid var(--grid); background: var(--sheet); color: var(--ink); border-radius: 14px;
  padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-family: var(--f-ui); font-size: 12px; font-weight: 600; cursor: pointer; position: relative;
}
.act svg { width: 22px; height: 22px; }
.act:disabled { opacity: .4; cursor: default; }
.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.act.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.act .badge {
  position: absolute; top: -6px; right: 6px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box;
  border-radius: 10px; background: var(--ink); color: var(--paper); font-family: var(--f-num); font-size: 11px;
  display: grid; place-items: center;
}
.act.nudge { animation: nudge .9s ease-in-out 2; }
@keyframes nudge { 30% { transform: translateY(-5px); } 60% { transform: translateY(0); } }

.toast {
  position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px);
  background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; z-index: 30;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.modal-bg {
  position: fixed; inset: 0; background: rgba(15,21,28,.45); display: grid; place-items: center; z-index: 40;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal {
  background: var(--sheet); color: var(--ink); border-radius: 18px; padding: 22px 20px 18px; width: 100%; max-width: 380px;
  box-shadow: var(--shadow); max-height: 100%; overflow-y: auto; box-sizing: border-box;
}
.modal h2 { margin: 0 0 6px; font-size: 20px; text-wrap: balance; }
.modal p { margin: 0 0 12px; color: var(--muted); line-height: 1.55; font-size: 14px; }
.modal .big { font-family: var(--f-num); font-size: 40px; color: var(--accent); margin: 4px 0 12px; }
.modal ul { margin: 0 0 14px; padding-left: 18px; line-height: 1.6; font-size: 14px; }
.modal ul li { margin-bottom: 4px; }
.modal kbd { font-family: var(--f-ui); font-weight: 600; background: var(--mark); color: var(--mark-ink); padding: 0 5px; border-radius: 4px; }
.btns { display: grid; gap: 8px; }
.btn {
  border: 1px solid var(--grid); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px;
  font-family: var(--f-ui); font-size: 15px; font-weight: 600; cursor: pointer; text-align: left;
}
.btn small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary small { color: inherit; opacity: .8; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.demo { display: grid; grid-template-columns: repeat(5, 30px); gap: 0; margin: 6px 0 14px; border-left: 1px solid var(--grid); border-top: 1px solid var(--grid); width: max-content; }
.demo span { width: 30px; height: 30px; display: grid; place-items: center; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); font-family: var(--f-num); font-size: 15px; position: relative; }
.demo span.g { color: var(--faint); font-size: 11px; }
.demo span.m::before { content: ""; position: absolute; inset: 15% 6%; background: var(--mark); border-radius: 3px; transform: rotate(-3deg); }
.demo span.m i { position: relative; color: var(--mark-ink); font-style: normal; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app">
  <header>
    <div class="brand"><h1>열맞춤 <b>10</b></h1><span class="lvl" id="lvl">LEVEL 1</span></div>
    <button class="icon-btn" id="helpBtn" aria-label="게임 방법">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.9"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></svg>
    </button>
  </header>
  <div class="stats">
    <div class="stat"><span>점수</span><strong id="score">0</strong></div>
    <div class="stat"><span>남은 숫자</span><strong id="left">0</strong></div>
    <div class="stat"><span>최고</span><strong id="best">0</strong></div>
  </div>
  <div class="board-wrap" id="boardWrap"><div class="board" id="board" role="grid" aria-label="숫자 판"></div></div>
  <nav class="tray">
    <button class="act" id="newBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M4.6 15a8 8 0 1 0 1.8-8.4L4 10"/></svg>새 게임
    </button>
    <button class="act" id="undoBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>되돌리기
    </button>
    <button class="act" id="hintBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>힌트<span class="badge" id="hintN">3</span>
    </button>
    <button class="act primary" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>숫자 추가<span class="badge" id="addN">5</span>
    </button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
(() => {
  const COLS = 9;
  const KEY = "yeolmatchum-v1";
  const ADDS_PER_LEVEL = 5;
  const HINTS_PER_LEVEL = 3;
  const $ = (id) => document.getElementById(id);

  let S = null;          // game state
  let sel = null;        // selected index
  let hintPair = null;
  let busy = false;
  let history = [];

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- board generation ----------
  function classicCells() {
    const d = [];
    for (let n = 1; n <= 19; n++) { if (n === 10) continue; for (const ch of String(n)) d.push(+ch); }
    return d; // 1..9, 1 1 1 2 ... 1 9  → 27 digits
  }
  function randomCells(level) {
    const count = Math.min(27 + (level - 1) * 3, 54);
    for (let tries = 0; tries < 200; tries++) {
      const d = Array.from({ length: count }, () => 1 + Math.floor(Math.random() * 9));
      const test = d.map((v) => ({ v, g: 0 }));
      if (allMoves(test).length >= 4) return d;
    }
    return Array.from({ length: count }, () => 1 + Math.floor(Math.random() * 9));
  }
  function newGame(mode) {
    const digits = mode === "classic" ? classicCells() : randomCells(1);
    S = { cells: digits.map((v) => ({ v, g: 0 })), score: 0, level: 1, adds: ADDS_PER_LEVEL, hints: HINTS_PER_LEVEL,
          best: S ? S.best : (store.get()?.best || 0), mode };
    history = []; sel = null; hintPair = null;
    closeModal(); save(); render(); $("boardWrap").scrollTop = 0;
  }
  function nextLevel() {
    S.level += 1;
    S.cells = randomCells(S.level).map((v) => ({ v, g: 0 }));
    S.adds = ADDS_PER_LEVEL; S.hints = HINTS_PER_LEVEL;
    history = []; sel = null; hintPair = null;
    closeModal(); save(); render(); $("boardWrap").scrollTop = 0;
  }

  // ---------- rules ----------
  const valuesOk = (a, b) => a === b || a + b === 10;
  function pathClear(cells, i, j) {
    if (i > j) [i, j] = [j, i];
    // reading order: includes side-by-side and wrapping from row end to next row start
    let ok = true;
    for (let k = i + 1; k < j; k++) if (!cells[k].g) { ok = false; break; }
    if (ok) return true;
    const r1 = Math.floor(i / COLS), c1 = i % COLS, r2 = Math.floor(j / COLS), c2 = j % COLS;
    const dr = r2 - r1, dc = c2 - c1;
    let step = 0;
    if (dc === 0 && dr > 0) step = COLS;                       // vertical
    else if (dr > 0 && Math.abs(dc) === dr) step = COLS + Math.sign(dc); // diagonal
    else return false;
    for (let k = i + step; k < j; k += step) if (!cells[k].g) return false;
    return true;
  }
  function canMatch(cells, i, j) {
    if (i === j) return false;
    const a = cells[i], b = cells[j];
    if (!a || !b || a.g || b.g) return false;
    return valuesOk(a.v, b.v) && pathClear(cells, i, j);
  }
  function allMoves(cells) {
    const out = [];
    const n = cells.length;
    for (let i = 0; i < n; i++) {
      if (cells[i].g) continue;
      const c = i % COLS;
      // forward neighbours in 4 directions: reading order, down, down-right, down-left
      const dirs = [
        { step: 1, colStep: null },
        { step: COLS, colStep: 0 },
        { step: COLS + 1, colStep: 1 },
        { step: COLS - 1, colStep: -1 },
      ];
      for (const d of dirs) {
        let k = i + d.step, col = c;
        while (k < n) {
          if (d.colStep !== null) { col += d.colStep; if (col < 0 || col >= COLS) break; }
          if (!cells[k].g) { if (valuesOk(cells[i].v, cells[k].v)) out.push([i, k]); break; }
          k += d.step;
        }
      }
    }
    return out;
  }
  const remaining = () => S.cells.reduce((s, c) => s + (c.g ? 0 : 1), 0);

  // ---------- actions ----------
  function snapshot() {
    history.push(JSON.stringify({ cells: S.cells, score: S.score, adds: S.adds }));
    if (history.length > 60) history.shift();
  }
  function undo() {
    if (busy || !history.length) return;
    const h = JSON.parse(history.pop());
    S.cells = h.cells; S.score = h.score; S.adds = h.adds;
    sel = null; hintPair = null; save(); render();
  }

  function tap(i) {
    if (busy) return;
    const c = S.cells[i];
    if (!c || c.g) return;
    hintPair = null;
    if (sel === null) { sel = i; render(); return; }
    if (sel === i) { sel = null; render(); return; }
    if (canMatch(S.cells, sel, i)) { doMatch(sel, i); return; }
    // not a match: flash and move selection
    const prev = sel;
    sel = i; render();
    flash([prev, i], "bad");
    if (valuesOk(S.cells[prev].v, c.v)) toast("사이에 다른 숫자가 있어요");
  }

  function doMatch(i, j) {
    snapshot();
    const a = Math.min(i, j), b = Math.max(i, j);
    const near = b - a === 1 || b - a === COLS || b - a === COLS + 1 || b - a === COLS - 1;
    S.cells[a].g = 1; S.cells[b].g = 1;
    let gained = near ? 1 : 4;
    sel = null;
    vibrate(12);
    render(); flash([a, b], "pop");

    // rows to remove: rows of a and b that are fully cleared
    const rows = [...new Set([Math.floor(a / COLS), Math.floor(b / COLS)])].sort((x, y) => y - x);
    const dead = rows.filter((r) => {
      const start = r * COLS, end = Math.min(start + COLS, S.cells.length);
      for (let k = start; k < end; k++) if (!S.cells[k].g) return false;
      return true;
    });
    if (dead.length) {
      busy = true;
      gained += 10 * dead.length;
      dead.forEach((r) => {
        for (let k = r * COLS; k < Math.min(r * COLS + COLS, S.cells.length); k++) cellEl(k)?.classList.add("vanish");
      });
      setTimeout(() => {
        dead.forEach((r) => S.cells.splice(r * COLS, COLS));
        busy = false;
        finishMove(gained, dead.length);
      }, 260);
    } else finishMove(gained, 0);
  }

  function finishMove(gained, rowsCleared) {
    S.score += gained;
    if (rowsCleared) toast(rowsCleared > 1 ? `${rowsCleared}줄 삭제 +${gained}` : `줄 삭제 +${gained}`);
    if (remaining() === 0) {
      const bonus = 50 + S.level * 25 + S.adds * 10;
      S.score += bonus; S.cells = [];
      updateBest(); save(); render();
      showModal(`
        <h2>레벨 ${S.level} 클리어</h2>
        <p>판을 모두 비웠어요. 남은 추가 횟수 보너스 포함</p>
        <div class="big">+${bonus}</div>
        <div class="btns"><button class="btn primary" data-act="next">레벨 ${S.level + 1} 시작<small>숫자가 조금 더 많아져요</small></button></div>`);
      return;
    }
    updateBest(); save(); render();
    checkStuck();
  }

  function addNumbers() {
    if (busy) return;
    if (S.adds <= 0) { toast("추가 횟수를 다 썼어요"); return; }
    const rest = S.cells.filter((c) => !c.g).map((c) => ({ v: c.v, g: 0 }));
    if (!rest.length) return;
    snapshot();
    const from = S.cells.length;
    S.cells.push(...rest);
    S.adds -= 1; sel = null; hintPair = null;
    save(); render();
    for (let k = from; k < S.cells.length; k++) cellEl(k)?.classList.add("pop");
    const wrap = $("boardWrap");
    requestAnimationFrame(() => { const el = cellEl(from); if (el) wrap.scrollTop = Math.max(0, el.offsetTop - wrap.clientHeight / 2); });
    toast(`숫자 ${rest.length}개 추가`);
    checkStuck();
  }

  function hint() {
    if (busy) return;
    const moves = allMoves(S.cells);
    if (!moves.length) {
      if (S.adds > 0) { toast("짝이 없어요. 숫자를 추가하세요"); nudge(); } else checkStuck();
      return;
    }
    if (S.hints <= 0) { toast("힌트를 다 썼어요"); return; }
    S.hints -= 1;
    hintPair = moves[Math.floor(Math.random() * moves.length)];
    sel = null; save(); render();
    const el = cellEl(hintPair[0]);
    if (el) { const wrap = $("boardWrap"); wrap.scrollTop = Math.max(0, el.offsetTop - wrap.clientHeight / 3); }
  }

  function checkStuck() {
    if (allMoves(S.cells).length) return;
    if (S.adds > 0) { nudge(); return; }
    updateBest(); save();
    showModal(`
      <h2>더 이상 짝이 없어요</h2>
      <p>추가 횟수도 모두 썼어요. 레벨 ${S.level}, 남은 숫자 ${remaining()}개</p>
      <div class="big">${S.score}</div>
      <div class="btns">
        <button class="btn" data-act="undo">한 수 되돌리기<small>마지막으로 둔 수를 취소해요</small></button>
        <button class="btn primary" data-act="new-random">새 게임</button>
      </div>`);
  }

  // ---------- rendering ----------
  function render() {
    const board = $("board");
    const n = S.cells.length;
    const total = Math.max(Math.ceil(n / COLS) * COLS, COLS * 3);
    let html = "";
    for (let k = 0; k < total; k++) {
      if (k >= n) { html += `<div class="cell pad" aria-hidden="true"></div>`; continue; }
      const c = S.cells[k];
      let cls = "cell";
      if (c.g) cls += " gone";
      if (k === sel) cls += " sel";
      if (hintPair && (hintPair[0] === k || hintPair[1] === k)) cls += " hint";
      html += `<button class="${cls}" data-i="${k}" ${c.g ? 'tabindex="-1" aria-label="지운 칸"' : `aria-label="${c.v}"`}><i>${c.v}</i></button>`;
    }
    board.innerHTML = html;
    $("score").textContent = S.score;
    $("best").textContent = Math.max(S.best, S.score);
    $("left").textContent = remaining();
    $("lvl").textContent = `LEVEL ${S.level}`;
    $("hintN").textContent = S.hints;
    $("addN").textContent = S.adds;
    $("addBtn").disabled = S.adds <= 0;
    $("undoBtn").disabled = history.length === 0;
  }
  const cellEl = (k) => document.querySelector(`.cell[data-i="${k}"]`);
  function flash(idx, cls) {
    idx.forEach((k) => { const el = cellEl(k); if (el) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); } });
  }
  function nudge() { const b = $("addBtn"); b.classList.remove("nudge"); void b.offsetWidth; b.classList.add("nudge"); }
  let toastT = 0;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600);
  }
  function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
  function updateBest() { if (S.score > S.best) S.best = S.score; }
  function save() { store.set({ ...S }); }

  // ---------- modals ----------
  function showModal(inner) {
    $("modalRoot").innerHTML = `<div class="modal-bg" data-act="bg"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
    const first = $("modalRoot").querySelector(".btn"); if (first) first.focus();
  }
  function closeModal() { $("modalRoot").innerHTML = ""; }
  function newGameMenu() {
    showModal(`
      <h2>새 게임</h2>
      <p>지금 판은 사라져요. 어떤 판으로 시작할까요?</p>
      <div class="btns">
        <button class="btn primary" data-act="new-random">랜덤 숫자<small>숫자 27개를 무작위로 깔고 시작</small></button>
        <button class="btn" data-act="new-classic">클래식<small>1부터 19까지 순서대로 적고 시작</small></button>
        <button class="btn" data-act="close">계속하기</button>
      </div>`);
  }
  function helpModal() {
    showModal(`
      <h2>게임 방법</h2>
      <ul>
        <li><b>같은 숫자</b>(5·5)나 <b>합이 10</b>(3·7)인 두 칸을 차례로 누르면 지워져요.</li>
        <li>두 칸은 <b>가로, 세로, 대각선</b>으로 붙어 있어야 해요. 지운 칸은 건너뛸 수 있어요.</li>
        <li>줄 <b>끝 칸과 다음 줄 첫 칸</b>도 이어진 걸로 쳐요. 읽는 순서로 사이가 다 비었으면 OK.</li>
        <li>한 줄이 다 비면 줄이 사라져요. 판을 다 비우면 다음 레벨!</li>
        <li>짝이 없으면 <kbd>숫자 추가</kbd>: 남은 숫자를 순서대로 맨 뒤에 다시 적어요. 레벨마다 ${ADDS_PER_LEVEL}번.</li>
      </ul>
      <p>예: 아래 1과 9는 사이 칸이 지워져서 짝이 돼요.</p>
      <div class="demo"><span class="m"><i>1</i></span><span class="g">4</span><span class="g">6</span><span class="m"><i>9</i></span><span>2</span></div>
      <p>점수: 바로 옆 짝 1점, 떨어진 짝 4점, 줄 삭제 10점, 레벨 클리어 보너스.</p>
      <div class="btns"><button class="btn primary" data-act="close">알겠어요</button></div>`);
  }
  $("modalRoot").addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.dataset.act;
    if (act === "bg" && e.target !== t) return;
    if (act === "bg" || act === "close") closeModal();
    else if (act === "next") nextLevel();
    else if (act === "new-random") newGame("random");
    else if (act === "new-classic") newGame("classic");
    else if (act === "undo") { closeModal(); undo(); }
  });

  // ---------- wiring ----------
  $("board").addEventListener("click", (e) => {
    const b = e.target.closest(".cell[data-i]");
    if (b) tap(+b.dataset.i);
  });
  $("addBtn").addEventListener("click", addNumbers);
  $("hintBtn").addEventListener("click", hint);
  $("undoBtn").addEventListener("click", undo);
  $("newBtn").addEventListener("click", newGameMenu);
  $("helpBtn").addEventListener("click", helpModal);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
    if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); undo(); }
  });

  function start(data) {
    const saved = (data && data.S) || store.get();
    if (saved && Array.isArray(saved.cells)) {
      S = { adds: ADDS_PER_LEVEL, hints: HINTS_PER_LEVEL, level: 1, score: 0, best: 0, mode: "random", ...saved };
      if (data && data.history) history = data.history;
      render();
      if (!S.cells.length) nextLevel();
    } else {
      S = null;
      newGame("random");
      helpModal();
    }
  }
  try { window.claude?.hot?.snapshot?.(() => ({ S, history })); } catch (e) {}
  const hot = window.claude?.hot;
  if (hot?.ready) hot.ready(start); else start(hot?.data ?? {});

  if ("serviceWorker" in navigator && location.protocol === "https:" && window.self === window.top && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
<!--APP-END-->
</html>
