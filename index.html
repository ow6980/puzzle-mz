<html lang="ko">
<head>

<title>열맞춤</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen notebook — stats strip on top, graph-paper board scrolls in the middle, three actions pinned at the bottom.
   Each difficulty swaps the pen colour (accent) and the paper tint. */
:root {
  --paper: #eef3f7;
  --sheet: #fbfdfe;
  --grid: #d3dee8;
  --ink: #1b2a3a;
  --muted: #8494a6;
  --faint: #c3cfdb;
  --mark: #ffe14d;
  --mark-ink: #1b2a3a;
  --accent: #2547c4;
  --accent-ink: #ffffff;
  --bad: #d9434b;
  --shadow: 0 1px 0 rgba(27,42,58,.06), 0 8px 24px rgba(27,42,58,.08);
  /* difficulty themes: accent + paper */
  --easy: #1f8a5b;   --easy-paper: #edf6f1;
  --mid: #2547c4;    --mid-paper: #eef3f7;
  --hard: #7a3fc0;   --hard-paper: #f3f0f8;
  --pro: #c2410c;    --pro-paper: #f7f1ec;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f151c; --sheet: #151d26; --grid: #243241; --ink: #e4ecf4; --muted: #6f8295;
    --faint: #3a4a5b; --mark: #f2cf2e; --mark-ink: #11161c;
    --accent: #7f9bff; --accent-ink: #0f151c; --bad: #ff6b72;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --easy: #4cc98f;  --easy-paper: #0e1714;
    --mid: #7f9bff;   --mid-paper: #0f151c;
    --hard: #b48cf0;  --hard-paper: #14111c;
    --pro: #fb8a4c;   --pro-paper: #19120e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f151c; --sheet: #151d26; --grid: #243241; --ink: #e4ecf4; --muted: #6f8295;
  --faint: #3a4a5b; --mark: #f2cf2e; --mark-ink: #11161c;
  --accent: #7f9bff; --accent-ink: #0f151c; --bad: #ff6b72;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --easy: #4cc98f;  --easy-paper: #0e1714;
  --mid: #7f9bff;   --mid-paper: #0f151c;
  --hard: #b48cf0;  --hard-paper: #14111c;
  --pro: #fb8a4c;   --pro-paper: #19120e;
  color-scheme: dark;
}
body[data-diff="easy"] { --accent: var(--easy); --paper: var(--easy-paper); }
body[data-diff="mid"]  { --accent: var(--mid);  --paper: var(--mid-paper); }
body[data-diff="hard"] { --accent: var(--hard); --paper: var(--hard-paper); }
body[data-diff="pro"]  { --accent: var(--pro);  --paper: var(--pro-paper); }

html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui);
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; transition: background-color .3s;
}
.app {
  height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
.brand h1 b { color: var(--accent); font-family: var(--f-num); font-weight: 600; }
.chip {
  font-size: 12px; font-weight: 600; color: var(--accent); white-space: nowrap;
  border: 1.5px solid currentColor; border-radius: 999px; padding: 2px 9px;
}
.icon-btn {
  border: 0; background: transparent; color: var(--ink); width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--grid); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-bottom: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat span { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
.stat strong { font-family: var(--f-num); font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat:nth-child(2) { text-align: center; } .stat:nth-child(3) { text-align: right; }

.board-wrap {
  flex: 1; min-height: 0; overflow-y: auto; background: var(--sheet); border-radius: 14px; box-shadow: var(--shadow);
  scroll-behavior: smooth; position: relative;
}
.board {
  display: grid; grid-template-columns: repeat(9, 1fr);
  border-left: 1px solid var(--grid); border-top: 1px solid var(--grid);
  margin: 10px; background: var(--sheet);
}
.cell {
  aspect-ratio: 1; display: grid; place-items: center; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid);
  font-family: var(--f-num); font-weight: 500; font-size: min(7vw, 30px); line-height: 1; color: var(--ink);
  user-select: none; cursor: pointer; position: relative; transition: color .2s, background-color .15s;
  background: none; padding: 0; border-top: 0; border-left: 0; border-radius: 0; min-width: 0;
}
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.cell.gone { color: var(--faint); cursor: default; font-size: min(5vw, 20px); font-weight: 400; }
.cell.pad { cursor: default; }
.cell.sel::before {
  content: ""; position: absolute; inset: 14% 8%; border-radius: 4px 9px 5px 8px;
  background: var(--mark); transform: rotate(-3deg); opacity: .95;
}
.cell.sel { color: var(--mark-ink); }
.cell > i { position: relative; font-style: normal; }
.cell.pop { animation: pop .32s ease-out; }
.cell.bad { animation: shake .3s; color: var(--bad); }
.cell.vanish { animation: vanish .28s ease-in forwards; }
@keyframes pop { 0% { transform: scale(1.25); color: var(--accent); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }
@keyframes vanish { to { opacity: 0; transform: scaleY(.2); } }

.tray { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; padding-block: 12px max(14px, env(safe-area-inset-bottom, 0px)); }
.act {
  border: 1px solid var(--grid); background: var(--sheet); color: var(--ink); border-radius: 14px;
  padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-family: var(--f-ui); font-size: 12px; font-weight: 600; cursor: pointer; position: relative;
}
.act svg { width: 22px; height: 22px; }
.act:disabled { opacity: .4; cursor: default; }
.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.act.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.act .badge {
  position: absolute; top: -6px; right: 8px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box;
  border-radius: 10px; background: var(--ink); color: var(--paper); font-family: var(--f-num); font-size: 11px; font-weight: 500;
  display: grid; place-items: center;
}
.act.nudge { animation: nudge .9s ease-in-out 2; }
@keyframes nudge { 30% { transform: translateY(-5px); } 60% { transform: translateY(0); } }

.toast {
  position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px);
  background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; z-index: 30;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.modal-bg {
  position: fixed; inset: 0; background: rgba(15,21,28,.45); display: grid; place-items: center; z-index: 40;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal {
  background: var(--sheet); color: var(--ink); border-radius: 18px; padding: 22px 20px 18px; width: 100%; max-width: 380px;
  box-shadow: var(--shadow); max-height: 100%; overflow-y: auto; box-sizing: border-box;
}
.modal h2 { margin: 0 0 6px; font-size: 20px; text-wrap: balance; }
.modal p { margin: 0 0 12px; color: var(--muted); line-height: 1.55; font-size: 14px; }
.modal .big { font-family: var(--f-num); font-weight: 500; font-size: 40px; color: var(--accent); margin: 4px 0 12px; }
.modal ul { margin: 0 0 14px; padding-left: 18px; line-height: 1.6; font-size: 14px; }
.modal ul li { margin-bottom: 4px; }
.modal kbd { font-family: var(--f-ui); font-weight: 600; background: var(--mark); color: var(--mark-ink); padding: 0 5px; border-radius: 4px; }
.btns { display: grid; gap: 8px; }
.btn {
  border: 1px solid var(--grid); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px;
  font-family: var(--f-ui); font-size: 15px; font-weight: 600; cursor: pointer; text-align: left;
}
.btn small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary small { color: inherit; opacity: .8; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.diff-btn { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 12px; }
.diff-btn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.diff-btn .rec { font-family: var(--f-num); font-weight: 500; font-size: 12px; color: var(--muted); text-align: right; }
.diff-btn.cur { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.demo { display: grid; grid-template-columns: repeat(5, 30px); gap: 0; margin: 6px 0 14px; border-left: 1px solid var(--grid); border-top: 1px solid var(--grid); width: max-content; }
.demo span { width: 30px; height: 30px; display: grid; place-items: center; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); font-family: var(--f-num); font-weight: 500; font-size: 15px; position: relative; }
.demo span.g { color: var(--faint); font-size: 11px; font-weight: 400; }
.demo span.m::before { content: ""; position: absolute; inset: 15% 6%; background: var(--mark); border-radius: 3px; transform: rotate(-3deg); }
.demo span.m i { position: relative; color: var(--mark-ink); font-style: normal; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app">
  <header>
    <div class="brand"><h1>열맞춤 <b>10</b></h1><span class="chip" id="lvl">중간 · 1단계</span></div>
    <button class="icon-btn" id="soundBtn" aria-label="효과음 끄기"></button>
  </header>
  <div class="stats">
    <div class="stat"><span>점수</span><strong id="score">0</strong></div>
    <div class="stat"><span>남은 숫자</span><strong id="left">0</strong></div>
    <div class="stat"><span>최고</span><strong id="best">0</strong></div>
  </div>
  <div class="board-wrap" id="boardWrap"><div class="board" id="board" role="grid" aria-label="숫자 판"></div></div>
  <nav class="tray">
    <button class="act" id="newBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M4.6 15a8 8 0 1 0 1.8-8.4L4 10"/></svg>새 게임
    </button>
    <button class="act primary" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>열 추가<span class="badge" id="addN">5</span>
    </button>
    <button class="act" id="helpBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.9"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></svg>도움말
    </button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
(() => {
  const COLS = 9;
  const KEY = "yeolmatchum-v2";
  const $ = (id) => document.getElementById(id);

  // Difficulty: start size, growth per stage, adds per stage, and how generous the board is.
  // pick: among many random boards, which one to use by number of available pairs (1 = most pairs, 0 = fewest).
  const DIFFS = {
    easy: { name: "쉬움", count: 27, grow: 2, max: 45, adds: 6, pick: 1.0,  minMoves: 6, desc: "숫자 27개 · 짝이 많은 판 · 열 추가 6번" },
    mid:  { name: "중간", count: 36, grow: 3, max: 54, adds: 5, pick: 0.5,  minMoves: 3, desc: "숫자 36개 · 보통 판 · 열 추가 5번" },
    hard: { name: "어려움", count: 45, grow: 3, max: 63, adds: 4, pick: 0.2, minMoves: 2, desc: "숫자 45개 · 짝이 적은 판 · 열 추가 4번" },
    pro:  { name: "숙련", count: 54, grow: 3, max: 72, adds: 3, pick: 0.0,  minMoves: 1, desc: "숫자 54개 · 짝이 가장 적은 판 · 열 추가 3번" },
  };

  let S = null;          // game state
  let sel = null;
  let busy = false;
  let muted = false;
  let bests = {};

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- sound (synthesised, no files) ----------
  let ac = null;
  function audio() {
    if (muted) return null;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  function tone(freq, { at = 0, dur = 0.09, type = "sine", vol = 0.07, to = null } = {}) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + at;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    select: () => tone(740, { dur: 0.05, vol: 0.04 }),
    match:  () => { tone(880, { dur: 0.08, type: "triangle", vol: 0.07 }); tone(1320, { at: 0.06, dur: 0.12, type: "triangle", vol: 0.06 }); },
    wrong:  () => tone(170, { dur: 0.14, type: "triangle", vol: 0.09, to: 120 }),
    row:    () => [784, 988, 1175].forEach((f, k) => tone(f, { at: k * 0.06, dur: 0.12, type: "triangle", vol: 0.06 })),
    add:    () => tone(420, { dur: 0.16, vol: 0.06, to: 840 }),
    clear:  () => [523, 659, 784, 1047].forEach((f, k) => tone(f, { at: k * 0.09, dur: 0.22, type: "triangle", vol: 0.07 })),
    over:   () => [392, 330, 262].forEach((f, k) => tone(f, { at: k * 0.12, dur: 0.22, type: "triangle", vol: 0.06 })),
  };
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // ---------- board generation ----------
  function makeBoard(diffKey, stage) {
    const D = DIFFS[diffKey];
    const count = Math.min(D.count + (stage - 1) * D.grow, D.max);
    const cands = [];
    for (let t = 0; t < 40; t++) {
      const d = Array.from({ length: count }, () => 1 + Math.floor(Math.random() * 9));
      const m = allMoves(d.map((v) => ({ v, g: 0 }))).length;
      if (m >= D.minMoves) cands.push({ d, m });
    }
    if (!cands.length) return Array.from({ length: count }, () => 1 + Math.floor(Math.random() * 9));
    cands.sort((x, y) => x.m - y.m);
    return cands[Math.round(D.pick * (cands.length - 1))].d;
  }
  function newGame(diff) {
    S = { diff, stage: 1, score: 0, adds: DIFFS[diff].adds, cells: makeBoard(diff, 1).map((v) => ({ v, g: 0 })) };
    sel = null; closeModal(); save(); render(); $("boardWrap").scrollTop = 0;
  }
  function nextStage() {
    S.stage += 1;
    S.cells = makeBoard(S.diff, S.stage).map((v) => ({ v, g: 0 }));
    S.adds = DIFFS[S.diff].adds;
    sel = null; closeModal(); save(); render(); $("boardWrap").scrollTop = 0;
  }

  // ---------- rules ----------
  const valuesOk = (a, b) => a === b || a + b === 10;
  function pathClear(cells, i, j) {
    if (i > j) [i, j] = [j, i];
    // reading order: side by side, and row end → next row start
    let ok = true;
    for (let k = i + 1; k < j; k++) if (!cells[k].g) { ok = false; break; }
    if (ok) return true;
    const r1 = Math.floor(i / COLS), c1 = i % COLS, r2 = Math.floor(j / COLS), c2 = j % COLS;
    const dr = r2 - r1, dc = c2 - c1;
    let step;
    if (dc === 0 && dr > 0) step = COLS;
    else if (dr > 0 && Math.abs(dc) === dr) step = COLS + Math.sign(dc);
    else return false;
    for (let k = i + step; k < j; k += step) if (!cells[k].g) return false;
    return true;
  }
  function canMatch(cells, i, j) {
    if (i === j) return false;
    const a = cells[i], b = cells[j];
    if (!a || !b || a.g || b.g) return false;
    return valuesOk(a.v, b.v) && pathClear(cells, i, j);
  }
  const DIRS = [{ step: 1, cs: null }, { step: COLS, cs: 0 }, { step: COLS + 1, cs: 1 }, { step: COLS - 1, cs: -1 }];
  function allMoves(cells) {
    const out = [], n = cells.length;
    for (let i = 0; i < n; i++) {
      if (cells[i].g) continue;
      for (const d of DIRS) {
        let k = i + d.step, col = i % COLS;
        while (k < n) {
          if (d.cs !== null) { col += d.cs; if (col < 0 || col >= COLS) break; }
          if (!cells[k].g) { if (valuesOk(cells[i].v, cells[k].v)) out.push([i, k]); break; }
          k += d.step;
        }
      }
    }
    return out;
  }
  const remaining = () => S.cells.reduce((s, c) => s + (c.g ? 0 : 1), 0);

  // ---------- actions ----------
  function tap(i) {
    if (busy) return;
    const c = S.cells[i];
    if (!c || c.g) return;
    if (sel === null) { sel = i; sfx.select(); render(); return; }
    if (sel === i) { sel = null; render(); return; }
    if (canMatch(S.cells, sel, i)) { doMatch(sel, i); return; }
    const prev = sel;
    sel = i; render();
    flash([prev, i], "bad");
    sfx.wrong(); vibrate(35);
    if (valuesOk(S.cells[prev].v, c.v)) toast("사이에 다른 숫자가 있어요");
  }

  function doMatch(i, j) {
    const a = Math.min(i, j), b = Math.max(i, j);
    const near = b - a === 1 || b - a === COLS || b - a === COLS + 1 || b - a === COLS - 1;
    S.cells[a].g = 1; S.cells[b].g = 1;
    let gained = near ? 1 : 4;
    sel = null;
    render(); flash([a, b], "pop");

    const rows = [...new Set([Math.floor(a / COLS), Math.floor(b / COLS)])].sort((x, y) => y - x);
    const dead = rows.filter((r) => {
      for (let k = r * COLS; k < Math.min(r * COLS + COLS, S.cells.length); k++) if (!S.cells[k].g) return false;
      return true;
    });
    if (dead.length) {
      busy = true;
      gained += 10 * dead.length;
      dead.forEach((r) => { for (let k = r * COLS; k < Math.min(r * COLS + COLS, S.cells.length); k++) cellEl(k)?.classList.add("vanish"); });
      if (remaining() > 0) sfx.row(); else sfx.match();
      setTimeout(() => {
        dead.forEach((r) => S.cells.splice(r * COLS, COLS));
        busy = false;
        finishMove(gained, dead.length);
      }, 260);
    } else { sfx.match(); finishMove(gained, 0); }
  }

  function finishMove(gained, rowsCleared) {
    S.score += gained;
    if (rowsCleared) toast(rowsCleared > 1 ? `${rowsCleared}줄 삭제 +${gained}` : `줄 삭제 +${gained}`);
    if (remaining() === 0) {
      const bonus = 50 + S.stage * 25 + S.adds * 10;
      S.score += bonus; S.cells = [];
      updateBest(); save(); render();
      setTimeout(sfx.clear, 200);
      showModal(`
        <h2>${DIFFS[S.diff].name} ${S.stage}단계 클리어</h2>
        <p>판을 모두 비웠어요. 남은 열 추가 보너스 포함</p>
        <div class="big">+${bonus}</div>
        <div class="btns"><button class="btn primary" data-act="next">${S.stage + 1}단계 시작<small>숫자가 조금 더 많아져요</small></button></div>`);
      return;
    }
    updateBest(); save(); render();
    checkStuck();
  }

  function addNumbers() {
    if (busy) return;
    if (S.adds <= 0) { toast("열 추가를 다 썼어요"); sfx.wrong(); return; }
    const rest = S.cells.filter((c) => !c.g).map((c) => ({ v: c.v, g: 0 }));
    if (!rest.length) return;
    const from = S.cells.length;
    S.cells.push(...rest);
    S.adds -= 1; sel = null;
    sfx.add();
    save(); render();
    for (let k = from; k < S.cells.length; k++) cellEl(k)?.classList.add("pop");
    const wrap = $("boardWrap");
    requestAnimationFrame(() => { const el = cellEl(from); if (el) wrap.scrollTop = Math.max(0, el.offsetTop - wrap.clientHeight / 2); });
    toast(`숫자 ${rest.length}개 추가`);
    checkStuck();
  }

  function checkStuck() {
    if (allMoves(S.cells).length) return;
    if (S.adds > 0) { nudge(); return; }
    updateBest(); save();
    setTimeout(sfx.over, 150);
    showModal(`
      <h2>더 이상 짝이 없어요</h2>
      <p>열 추가도 모두 썼어요. ${DIFFS[S.diff].name} ${S.stage}단계, 남은 숫자 ${remaining()}개</p>
      <div class="big">${S.score}</div>
      <div class="btns">
        <button class="btn primary" data-act="new-${S.diff}">${DIFFS[S.diff].name} 다시 하기</button>
        <button class="btn" data-act="menu">난이도 바꾸기</button>
      </div>`);
  }

  // ---------- rendering ----------
  function render() {
    document.body.dataset.diff = S.diff;
    const n = S.cells.length;
    const total = Math.max(Math.ceil(n / COLS) * COLS, COLS * 3);
    let html = "";
    for (let k = 0; k < total; k++) {
      if (k >= n) { html += `<div class="cell pad" aria-hidden="true"></div>`; continue; }
      const c = S.cells[k];
      let cls = "cell";
      if (c.g) cls += " gone";
      if (k === sel) cls += " sel";
      html += `<button class="${cls}" data-i="${k}" ${c.g ? 'tabindex="-1" aria-label="지운 칸"' : `aria-label="${c.v}"`}><i>${c.v}</i></button>`;
    }
    $("board").innerHTML = html;
    $("score").textContent = S.score;
    $("best").textContent = Math.max(bests[S.diff] || 0, S.score);
    $("left").textContent = remaining();
    $("lvl").textContent = `${DIFFS[S.diff].name} · ${S.stage}단계`;
    $("addN").textContent = S.adds;
    $("addBtn").disabled = S.adds <= 0;
  }
  function renderSound() {
    $("soundBtn").setAttribute("aria-label", muted ? "효과음 켜기" : "효과음 끄기");
    $("soundBtn").innerHTML = muted
      ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="m17 9 5 6M22 9l-5 6"/></svg>`
      : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
  }
  const cellEl = (k) => document.querySelector(`.cell[data-i="${k}"]`);
  function flash(idx, cls) {
    idx.forEach((k) => { const el = cellEl(k); if (el) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); } });
  }
  function nudge() { const b = $("addBtn"); b.classList.remove("nudge"); void b.offsetWidth; b.classList.add("nudge"); }
  let toastT = 0;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600);
  }
  function updateBest() { if (S.score > (bests[S.diff] || 0)) { bests[S.diff] = S.score; store.set(KEY + "-best", bests); } }
  function save() { store.set(KEY, S); }

  // ---------- modals ----------
  function showModal(inner) {
    $("modalRoot").innerHTML = `<div class="modal-bg" data-act="bg"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
    const first = $("modalRoot").querySelector(".btn"); if (first) first.focus();
  }
  function closeModal() { $("modalRoot").innerHTML = ""; }
  function diffMenu(first) {
    const items = Object.entries(DIFFS).map(([k, D]) => `
      <button class="btn diff-btn${S && S.diff === k ? " cur" : ""}" data-act="new-${k}" style="--c: var(--${k})">
        <span class="dot"></span><span>${D.name}<small>${D.desc}</small></span><span class="rec">최고<br>${bests[k] || 0}</span>
      </button>`).join("");
    showModal(`
      <h2>${first ? "난이도를 고르세요" : "새 게임"}</h2>
      <p>${first ? "단계를 깰수록 숫자가 늘어나요." : "지금 판은 사라져요. 난이도를 골라 새로 시작해요."}</p>
      <div class="btns">${items}${first ? "" : `<button class="btn" data-act="close">계속하기</button>`}</div>`);
  }
  function helpModal() {
    showModal(`
      <h2>게임 방법</h2>
      <ul>
        <li><b>같은 숫자</b>(5·5)나 <b>합이 10</b>(3·7)인 두 칸을 차례로 누르면 지워져요.</li>
        <li>두 칸은 <b>가로, 세로, 대각선</b>으로 이어져 있어야 해요. 지운 칸은 건너뛸 수 있어요.</li>
        <li>줄 <b>끝 칸과 다음 줄 첫 칸</b>도 이어진 걸로 쳐요.</li>
        <li>한 줄이 다 비면 줄이 사라져요. 판을 다 비우면 다음 단계로!</li>
        <li>짝이 없으면 <kbd>열 추가</kbd>: 남은 숫자를 순서대로 맨 뒤에 다시 적어요.</li>
      </ul>
      <p>예: 아래 1과 9는 사이 칸이 지워져서 짝이 돼요.</p>
      <div class="demo"><span class="m"><i>1</i></span><span class="g">4</span><span class="g">6</span><span class="m"><i>9</i></span><span>2</span></div>
      <p>점수: 바로 옆 짝 1점, 떨어진 짝 4점, 줄 삭제 10점, 단계 클리어 보너스.</p>
      <div class="btns"><button class="btn primary" data-act="close">알겠어요</button></div>`);
  }
  $("modalRoot").addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.dataset.act;
    if (act === "bg") { if (e.target === t && S) closeModal(); return; }
    if (act === "close") closeModal();
    else if (act === "next") nextStage();
    else if (act === "menu") diffMenu(false);
    else if (act.startsWith("new-")) newGame(act.slice(4));
  });

  // ---------- wiring ----------
  $("board").addEventListener("click", (e) => {
    const b = e.target.closest(".cell[data-i]");
    if (b) tap(+b.dataset.i);
  });
  $("addBtn").addEventListener("click", addNumbers);
  $("newBtn").addEventListener("click", () => diffMenu(false));
  $("helpBtn").addEventListener("click", helpModal);
  $("soundBtn").addEventListener("click", () => {
    muted = !muted; store.set(KEY + "-muted", muted); renderSound(); if (!muted) sfx.select();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S) closeModal(); });

  function start(data) {
    bests = store.get(KEY + "-best") || {};
    muted = !!store.get(KEY + "-muted");
    renderSound();
    const saved = (data && data.S) || store.get(KEY);
    if (saved && Array.isArray(saved.cells) && DIFFS[saved.diff]) {
      S = saved;
      render();
      if (!S.cells.length) nextStage();
    } else {
      S = { diff: "mid", stage: 1, score: 0, adds: DIFFS.mid.adds, cells: makeBoard("mid", 1).map((v) => ({ v, g: 0 })) };
      render();
      S = null;
      diffMenu(true);
    }
  }
  try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}
  const hot = window.claude?.hot;
  if (hot?.ready) hot.ready(start); else start(hot?.data ?? {});

  if ("serviceWorker" in navigator && location.protocol === "https:" && window.self === window.top && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
<!--APP-END-->
</html>
